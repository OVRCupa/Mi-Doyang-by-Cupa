name: mi_doyang_app
description: "Mi Doyang by Cupa · Gestión de Academias de Taekwondo (Windows + Android)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  material_ui: ^1.1.0
  mi_doyang_core:
    path: ../core

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/fuentes/OFL.txt

  fonts:
    - family: Oswald
      fonts:
        - asset: assets/fuentes/Oswald-Variable.ttf
